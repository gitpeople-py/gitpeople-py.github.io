<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Твист 🌀</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at 30% 10%, #1a2a1f, #0d1a0a);
            margin: 0;
            padding: 16px;
        }
        .casino-card {
            max-width: 750px;
            width: 100%;
            background: linear-gradient(145deg, #1e3b1e, #122012);
            border-radius: 60px 60px 40px 40px;
            padding: 30px 24px 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), inset 0 1px 4px rgba(255,215,0,0.3);
            border: 1px solid #b8860b;
        }
        h1 {
            text-align: center;
            font-weight: 500;
            letter-spacing: 3px;
            color: #f5e56b;
            text-shadow: 0 0 12px #ffb347, 0 2px 0 #7a5c0a;
            margin-bottom: 28px;
            font-size: 2.1rem;
        }

        .twist-machine {
            background: #0a1307;
            border-radius: 40px;
            padding: 24px 20px 20px;
            border: 2px solid #b8860b;
            box-shadow: inset 0 0 30px #0f1f0a, 0 10px 0 #060d04;
        }

        .reels-container {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .reel-wrapper {
            flex: 1;
            min-width: 120px;
            background: #0d1a0a;
            border-radius: 30px;
            padding: 12px 8px;
            border: 2px solid #7f9640;
            box-shadow: inset 0 0 20px #1d3a14;
            position: relative;
            overflow: hidden;
        }

        .reel-label {
            text-align: center;
            color: #7f8f5a;
            font-size: 0.65rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .reel {
            background: #0f1f0a;
            border-radius: 20px;
            padding: 8px 0;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            border: 1px solid #3f642a;
            box-shadow: inset 0 0 30px #000000;
            transition: none;
        }

        .reel-item {
            font-size: 2.2rem;
            font-weight: 700;
            padding: 6px 0;
            text-align: center;
            width: 100%;
            color: #d4c07a;
            text-shadow: 0 0 8px #b8860b;
            transition: none;
            line-height: 1.4;
            letter-spacing: 0.5px;
            background: #0f1f0a;
            border-radius: 12px;
        }

        .reel-item.active {
            background: #1e3b1e;
            color: #f5e56b;
            text-shadow: 0 0 20px #f5b81b;
            box-shadow: 0 0 20px rgba(245, 184, 27, 0.15);
        }

        .reel.spinning .reel-item {
            animation: twistScroll 0.08s infinite alternate;
        }

        @keyframes twistScroll {
            0% { transform: translateY(-10px) rotate(-2deg); opacity: 0.6; }
            100% { transform: translateY(10px) rotate(2deg); opacity: 1; }
        }

        .reel.spinning .reel-item.active {
            background: #2a4f2a;
            box-shadow: 0 0 30px rgba(245, 184, 27, 0.3);
        }

        .controls {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 6px;
        }

        .btn-twist {
            background: #d4a017;
            border: none;
            color: #1e2b12;
            padding: 16px 40px;
            border-radius: 60px;
            font-weight: 800;
            font-size: 1.4rem;
            box-shadow: 0 6px 0 #7a5c0a, 0 8px 20px rgba(0,0,0,0.6);
            cursor: pointer;
            transition: 0.08s linear;
            border: 1px solid #f5d742;
            letter-spacing: 2px;
            flex: 1;
            min-width: 160px;
        }
        .btn-twist:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #7a5c0a;
        }
        .btn-twist:hover {
            background: #f5c542;
            color: #0f1a0c;
        }
        .btn-twist:disabled {
            opacity: 0.5;
            transform: translateY(3px);
            box-shadow: 0 3px 0 #7a5c0a;
            pointer-events: none;
        }

        .btn-reset {
            background: #3a2a1a;
            border: 1px solid #b8860b;
            color: #f7eac6;
            padding: 16px 24px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1.2rem;
            box-shadow: 0 6px 0 #1f140a;
            cursor: pointer;
            transition: 0.08s linear;
            flex: 0.6;
            min-width: 100px;
        }
        .btn-reset:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #1f140a;
        }
        .btn-reset:hover {
            background: #5a401f;
        }

        .result-display {
            background: #0d1f0a;
            padding: 14px 20px;
            border-radius: 60px;
            color: #ebdba8;
            font-weight: 600;
            border: 1px solid #b8860b;
            box-shadow: inset 0 0 16px #1d3a14;
            text-align: center;
            font-size: 1.3rem;
            letter-spacing: 1px;
            min-height: 4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
            word-break: break-word;
        }

        .footer-note {
            text-align: center;
            color: #7f8f5a;
            font-size: 0.7rem;
            margin-top: 18px;
            letter-spacing: 1px;
            opacity: 0.7;
        }

        @media (max-width: 550px) {
            .casino-card { padding: 16px 12px; }
            .reel-wrapper { min-width: 80px; padding: 8px 4px; }
            .reel-item { font-size: 1.5rem; }
            .reel { min-height: 70px; }
            .btn-twist { font-size: 1.1rem; padding: 14px 20px; min-width: 120px; }
            .btn-reset { font-size: 1rem; padding: 14px 16px; }
            .result-display { font-size: 1rem; min-height: 3rem; }
        }
    </style>
</head>
<body>
<div class="casino-card">
    <h1>🌀 ТВИСТ</h1>

    <div class="twist-machine">
        <div class="reels-container">
            <!-- Колонка 1: Цвет -->
            <div class="reel-wrapper">
                <div class="reel-label">🎨 ЦВЕТ</div>
                <div class="reel" id="reel1">
                    <div class="reel-item active" id="reel1Display">—</div>
                </div>
            </div>
            <!-- Колонка 2: Рука/Нога -->
            <div class="reel-wrapper">
                <div class="reel-label">🦾 ЧАСТЬ</div>
                <div class="reel" id="reel2">
                    <div class="reel-item active" id="reel2Display">—</div>
                </div>
            </div>
            <!-- Колонка 3: Право/Лево -->
            <div class="reel-wrapper">
                <div class="reel-label">↔️ СТОРОНА</div>
                <div class="reel" id="reel3">
                    <div class="reel-item active" id="reel3Display">—</div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="btn-twist" id="twistBtn">🌀 КРУТИТЬ</button>
            <button class="btn-reset" id="resetBtn">⟳ Сброс</button>
        </div>

        <div class="result-display" id="resultDisplay">👉 Нажми «Крутить»</div>
    </div>

    <div class="footer-note">⚡ каждая колонка крутится и останавливается по очереди</div>
</div>

<script>
    (function(){
        // ---------- Данные ----------
        const COLORS = ['красный', 'синий', 'зелёный', 'жёлтый'];
        const LIMBS = ['рука', 'нога'];
        const SIDES = ['право', 'лево'];

        const COLOR_EMOJI = {
            'красный': '🔴',
            'синий': '🔵',
            'зелёный': '🟢',
            'жёлтый': '🟡'
        };
        const LIMB_EMOJI = {
            'рука': '✋',
            'нога': '🦵'
        };
        const SIDE_EMOJI = {
            'право': '➡️',
            'лево': '⬅️'
        };

        // ---------- DOM ----------
        const reel1Display = document.getElementById('reel1Display');
        const reel2Display = document.getElementById('reel2Display');
        const reel3Display = document.getElementById('reel3Display');
        const reel1 = document.getElementById('reel1');
        const reel2 = document.getElementById('reel2');
        const reel3 = document.getElementById('reel3');
        const resultDisplay = document.getElementById('resultDisplay');
        const twistBtn = document.getElementById('twistBtn');
        const resetBtn = document.getElementById('resetBtn');

        // ---------- Состояние ----------
        let state = {
            color: null,
            limb: null,
            side: null
        };

        let isSpinning = false;
        let spinTimer = null;

        // ---------- Вспомогательные функции ----------
        function getRandomItem(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function formatResult(color, limb, side) {
            if (!color || !limb || !side) return '⏳ жди...';
            const cEmoji = COLOR_EMOJI[color] || '';
            const lEmoji = LIMB_EMOJI[limb] || '';
            const sEmoji = SIDE_EMOJI[side] || '';
            return `${cEmoji} ${color} · ${lEmoji} ${limb} · ${sEmoji} ${side}`;
        }

        function updateDisplay(color, limb, side) {
            reel1Display.textContent = color ? `${COLOR_EMOJI[color] || ''} ${color}` : '—';
            reel2Display.textContent = limb ? `${LIMB_EMOJI[limb] || ''} ${limb}` : '—';
            reel3Display.textContent = side ? `${SIDE_EMOJI[side] || ''} ${side}` : '—';
            resultDisplay.textContent = formatResult(color, limb, side);
        }

        function resetAll() {
            if (isSpinning) return;
            state.color = null;
            state.limb = null;
            state.side = null;
            updateDisplay(null, null, null);
            resultDisplay.textContent = '👉 Нажми «Крутить»';
        }

        // ---------- Основная функция вращения ----------
        function twistReels() {
            if (isSpinning) return;

            isSpinning = true;
            twistBtn.disabled = true;
            resultDisplay.textContent = '🌀 Крутим...';

            state.color = null;
            state.limb = null;
            state.side = null;
            updateDisplay(null, null, null);

            reel1.classList.add('spinning');
            reel2.classList.add('spinning');
            reel3.classList.add('spinning');

            const finalColor = getRandomItem(COLORS);
            const finalLimb = getRandomItem(LIMBS);
            const finalSide = getRandomItem(SIDES);

            const STAGES = [
                { time: 400, reel: reel1, display: reel1Display, value: finalColor, type: 'color' },
                { time: 900, reel: reel2, display: reel2Display, value: finalLimb, type: 'limb' },
                { time: 1400, reel: reel3, display: reel3Display, value: finalSide, type: 'side' }
            ];

            if (spinTimer) {
                clearTimeout(spinTimer);
                spinTimer = null;
            }

            STAGES.forEach((stage, index) => {
                const timer = setTimeout(() => {
                    stage.reel.classList.remove('spinning');

                    const emoji = stage.type === 'color' ? COLOR_EMOJI[stage.value] :
                                  stage.type === 'limb' ? LIMB_EMOJI[stage.value] :
                                  SIDE_EMOJI[stage.value];
                    stage.display.textContent = `${emoji || ''} ${stage.value}`;

                    if (stage.type === 'color') state.color = stage.value;
                    else if (stage.type === 'limb') state.limb = stage.value;
                    else if (stage.type === 'side') state.side = stage.value;

                    if (index === 0) {
                        resultDisplay.textContent = `⏳ ${state.color} · ? · ?`;
                    } else if (index === 1) {
                        resultDisplay.textContent = `⏳ ${state.color} · ${state.limb} · ?`;
                    } else if (index === 2) {
                        resultDisplay.textContent = formatResult(state.color, state.limb, state.side);
                        isSpinning = false;
                        twistBtn.disabled = false;
                    }

                    if (index === STAGES.length - 1) {
                        reel1.classList.remove('spinning');
                        reel2.classList.remove('spinning');
                        reel3.classList.remove('spinning');
                        updateDisplay(state.color, state.limb, state.side);
                        isSpinning = false;
                        twistBtn.disabled = false;
                    }
                }, stage.time);

                if (index === STAGES.length - 1) {
                    spinTimer = timer;
                }
            });

            const safetyTimer = setTimeout(() => {
                if (isSpinning) {
                    reel1.classList.remove('spinning');
                    reel2.classList.remove('spinning');
                    reel3.classList.remove('spinning');
                    if (!state.color) state.color = getRandomItem(COLORS);
                    if (!state.limb) state.limb = getRandomItem(LIMBS);
                    if (!state.side) state.side = getRandomItem(SIDES);
                    updateDisplay(state.color, state.limb, state.side);
                    isSpinning = false;
                    twistBtn.disabled = false;
                    resultDisplay.textContent = formatResult(state.color, state.limb, state.side);
                }
            }, 2500);
        }

        // ---------- Инициализация ----------
        twistBtn.addEventListener('click', twistReels);
        resetBtn.addEventListener('click', resetAll);

        updateDisplay(null, null, null);
        resultDisplay.textContent = '👉 Нажми «Крутить»';
    })();
</script>
</body>
</html>
